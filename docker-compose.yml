services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banyanboard
      POSTGRES_USER: banyan
      POSTGRES_PASSWORD: banyanpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banyan -d banyanboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://banyan:banyanpassword@postgres:5432/banyanboard
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
